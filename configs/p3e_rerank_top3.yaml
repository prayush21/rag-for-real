# Phase 3e - p3b with only the top 3 reranked chunks sent to the LLM (p3b sends 10).
# If reranking puts the evidence at the top, fewer chunks should cost less at equal accuracy.
name: p3e_rerank_top3
description: p3b, top_k=3

ingest:
  parser: docling
  chunking:
    strategy: structure
    chunk_size: 512
    max_table_tokens: 1024
    min_chunk_tokens: 64
    context_header: true
  embedding:
    model: voyage/voyage-4
    dimensions: 1024

retrieval:
  strategy: dense
  candidate_k: 50
  reranker: voyage/rerank-2.5
  top_k: 3
