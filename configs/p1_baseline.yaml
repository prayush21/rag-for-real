# Phase 1 - naive baseline. Every later phase is measured against this.
name: p1_baseline
description: pypdf text, fixed 512-token chunks (64 overlap), voyage-4 dense search, top-10

ingest:
  parser: pypdf
  chunking:
    strategy: fixed_tokens
    chunk_size: 512
    chunk_overlap: 64
  embedding:
    model: voyage/voyage-4        # 200M free tokens; any LiteLLM embedding model works
    dimensions: 1024
    batch_size: 64

retrieval:
  strategy: dense
  top_k: 10

generation:
  model: anthropic/claude-haiku-5-5   # any LiteLLM chat model string
  max_tokens: 16000                   # thinking models reason within this budget

eval:
  ks: [1, 3, 5, 10, 20]
  judge_model: anthropic/claude-haiku-5-5   # a stronger judge (e.g. anthropic/claude-sonnet-5-5) is more reliable
