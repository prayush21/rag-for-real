# Phase 3d - p2c + search only the filings of the company named in the question.
# Measures how many misses are company confusion; compare against p2c, not the reranker runs.
name: p3d_company_filter
description: p2c + rule-based company filter (questions naming no company search everything)

ingest:
  parser: docling
  chunking:
    strategy: structure
    chunk_size: 512
    max_table_tokens: 1024
    min_chunk_tokens: 64
    context_header: true
  embedding:
    model: voyage/voyage-4
    dimensions: 1024

retrieval:
  strategy: dense
  company_filter: true
  top_k: 10
