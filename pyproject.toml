[project]
name = "ragforreal"
version = "0.1.0"
description = "Production-style RAG over SEC filings, measured phase by phase against FinanceBench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "litellm>=1.50",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=9.0",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pgserver>=0.1", "docling-core>=2.100"]
modal = ["modal>=1.6"]

[project.scripts]
rag = "ragforreal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforreal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
